<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Package asset only. Phase 2 does not install this file. -->
  <policy user="root">
    <allow own="org.ghelper.Daemon1"/>
  </policy>

  <policy context="default">
    <deny own="org.ghelper.Daemon1"/>
    <!-- The bus policy only permits reaching the service. Mutating calls are
         separately attributed to the authenticated sender and checked by
         granular polkit actions inside ghelperd. -->
    <allow send_destination="org.ghelper.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.ghelper.Daemon1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.ghelper.Daemon1"
           send_interface="org.ghelper.Daemon1"/>
  </policy>
</busconfig>
